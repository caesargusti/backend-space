# Database Configuration (In-Memory H2)
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom Wallet Settings
# TODO: Candidate must map these to WalletProperties configuration bean
wallet.min-spend-amount=1.00
wallet.max-spend-amount=10000.00
wallet.tier-multipliers.bronze=1.0
wallet.tier-multipliers.silver=1.1
wallet.tier-multipliers.gold=1.2
wallet.tier-multipliers.platinum=1.5
